blueprint:
  name: Exhaust Fan Timer
  description: >
    Designed for use with the Inovelli White Series Fan Switch.
    Turns off an exhaust fan after a configurable timer. Each time the fan is
    turned on, it adds more time to the timer (up to a configurable maximum). 
    Pressing the down button cancels the timer and turns off the fan. 
    The fan turns off on Home Assistant restart as well.
    Option to add an additional button to control the fan (e.g. an Ikea Bilresa).
  domain: automation
  input:
    fan_switch:
      name: Fan Switch
      description: The switch entity controlling the exhaust fan.
      selector:
        entity:
          domain: switch
    button_up_entity:
      name: Button (Up)
      description: >
        The event entity for the up button on the Inovelli switch
        (e.g. event.inovelli_on_off_switch_button_up).
      selector:
        entity:
          domain: event
    button_down_entity:
      name: Button (Down)
      description: >
        The event entity for the down button on the Inovelli switch
        (e.g. event.inovelli_on_off_switch_button_down).
      selector:
        entity:
          domain: event
    button_up_entity_2:
      name: Secondary Button (Up)
      description: >
        Optional. The event entity for the up button on a secondary switch
        (e.g. event.ikea_bilresa_button_up). Leave blank if not used.
      default: {}
      selector:
        entity:
          domain: event
    button_down_entity_2:
      name: Secondary Button (Down)
      description: >
        Optional. The event entity for the down button on a secondary switch
        (e.g. event.ikea_bilresa_button_down). Leave blank if not used.
      default: {}
      selector:
        entity:
          domain: event
    timer_entity:
      name: Fan Timer
      description: >
        A Timer helper for this fan. Create one under Settings → Devices &
        Services → Helpers → Timer.
      selector:
        entity:
          domain: timer
    step_minutes:
      name: Minutes per press
      description: How many minutes to add each time the fan is switched on.
      default: 5
      selector:
        number:
          min: 5
          max: 30
          step: 5
          unit_of_measurement: minutes
          mode: slider
    max_minutes:
      name: Maximum minutes
      description: The timer will never exceed this value.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: minutes
          mode: slider
    led_intensity_entity:
      name: LED On Intensity
      description: >
        The number entity controlling the LED brightness while the switch is on
        (e.g. number.inovelli_on_off_switch_led_on_intensity_load_control).
      selector:
        entity:
          domain: number

mode: restart
max: 10

trigger:
  - platform: state
    entity_id: !input button_up_entity
    id: fan_on
  - platform: state
    entity_id: !input button_down_entity
    id: fan_off
  - platform: state
    entity_id: !input button_up_entity_2
    id: fan_on
  - platform: state
    entity_id: !input button_down_entity_2
    id: fan_off
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input timer_entity
    id: timer_done
  - platform: homeassistant
    event: start
    id: ha_start

variables:
  timer_entity: !input timer_entity
  step_minutes: !input step_minutes
  max_minutes: !input max_minutes
  button_up_entity_2: !input button_up_entity_2
  button_down_entity_2: !input button_down_entity_2

action:
  - choose:

      # Up button pressed — turn on fan, extend or start timer, set LED
      - conditions:
          - condition: trigger
            id: fan_on
          - condition: template
            value_template: >
              {{ trigger.to_state.attributes.event_type in ['multi_press_1', 'multi_press_2'] }}
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input fan_switch
          - variables:
              press_minutes: >
                {% if trigger.to_state.attributes.event_type == 'multi_press_2' %}
                  {{ step_minutes * 2 }}
                {% else %}
                  {{ step_minutes }}
                {% endif %}
              remaining_secs: >
                {% set r = state_attr(timer_entity, 'remaining') | default('0:00:00') %}
                {% if r in [none, 'unknown', 'unavailable'] %}
                  0
                {% else %}
                  {% set td = r | as_timedelta %}
                  {{ (td.seconds + td.days * 86400) | int }}
                {% endif %}
          - variables:
              new_secs: >
                {% set added = remaining_secs + (press_minutes * 60) %}
                {{ [added, max_minutes * 60] | min }}
          - service: timer.start
            target:
              entity_id: !input timer_entity
            data:
              duration: >
                {% set s = new_secs | int %}
                {{ '%02d:%02d:%02d' | format(s // 3600, (s % 3600) // 60, s % 60) }}
          - service: number.set_value
            target:
              entity_id: !input led_intensity_entity
            data:
              value: >
                {% set increments = (max_minutes / 5) | round(0, 'ceil') | int %}
                {% set brightness_per_increment = 75 / increments %}
                {% set mins_remaining = new_secs / 60 %}
                {% set steps = (mins_remaining / 5) | round(0, 'ceil') | int %}
                {% set steps_capped = [steps, increments] | min %}
                {{ (steps_capped * brightness_per_increment) | round | int }}

      # Down button pressed — turn off fan and cancel timer if active
      - conditions:
          - condition: trigger
            id: fan_off
          - condition: template
            value_template: >
              {{ trigger.to_state.attributes.event_type == 'multi_press_1' }}
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input fan_switch
          - condition: template
            value_template: >
              {{ states(timer_entity) == 'active' }}
          - service: timer.cancel
            target:
              entity_id: !input timer_entity

      # Timer expired — turn fan off
      - conditions:
          - condition: trigger
            id: timer_done
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input fan_switch

      # HA restarted — turn fan off and cancel timer if active
      - conditions:
          - condition: trigger
            id: ha_start
        sequence:
          - service: switch.turn_off
            target:
              entity_id: !input fan_switch
          - condition: template
            value_template: >
              {{ states(timer_entity) == 'active' }}
          - service: timer.cancel
            target:
              entity_id: !input timer_entity
